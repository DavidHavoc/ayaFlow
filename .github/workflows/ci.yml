name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  host-safe:
    name: Host-safe checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -p ayaflow-common -p ayaflow -p xtask --all-targets -- -D warnings

      - name: Host support summary
        run: cargo xtask check-host

      - name: Test shared crate
        run: cargo test -p ayaflow-common

      - name: Test host-safe userspace crate
        run: cargo test -p ayaflow

  linux-ebpf-build:
    name: Linux eBPF build validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # bpf-linker >= 0.13 no longer builds via `cargo install` without a
      # system LLVM, so use the pinned upstream prebuilt binary (same version
      # and checksum as the Dockerfile).
      - name: Install bpf-linker
        env:
          BPF_LINKER_VERSION: v0.13.0
          BPF_LINKER_SHA256: 0e9b2b30f68898177f1cb6f0ecbfa909a82479473a49a0ef66529fd088e3e410
        run: |
          tarball=bpf-linker-x86_64-unknown-linux-musl.tar.zst
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/${tarball}"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar --zstd -xf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" bpf-linker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bpf-linker" --version

      - name: Build userspace
        run: cargo xtask build-user

      - name: Build full Linux pipeline
        run: cargo xtask build

      - name: Check release build with embedded eBPF object
        run: |
          cargo xtask build-ebpf --release
          cargo clippy -p ayaflow --release --features embed-ebpf -- -D warnings
